# Alembic Configuration for CoursePilot AI

[alembic]
# Path to migration scripts, resolved relative to this alembic.ini file
script_location = %(here)s/../database/migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend backend/ so `app.*` imports resolve regardless of working directory
path_separator = os
prepend_sys_path = %(here)s

# Timezone for migration timestamps
timezone = UTC

# Truncate long revision slugs
truncate_slug_length = 40

# Database URL is injected dynamically in database/migrations/env.py from app.config.settings
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
